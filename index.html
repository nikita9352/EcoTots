<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EcoTots — Eco‑friendly essentials for little ones</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-light">
  <nav class="navbar navbar-light bg-white shadow-sm">
    <div class="container">
      <span class="navbar-brand fw-bold">EcoTots</span>
      <a class="btn btn-success" id="waTop" target="_blank">Chat on WhatsApp</a>
    </div>
  </nav>

  <main class="container my-4" id="shop">
    <div class="row g-3" id="productGrid"></div>
  </main>

  <footer class="container my-4 small text-muted">
    <hr />
    <p>Orders via WhatsApp: <a href="https://wa.me/919621146688" target="_blank">+91 9621146688</a></p>
    <p>UPI ID: <strong>9621146688@upi</strong></p>
    <p>&copy; 2026 EcoTots</p>
  </footer>

  <script>
    const WHATSAPP_NUMBER = '919621146688';
    const UPI_ID = '9621146688@upi';
    const PAYEE_NAME = 'Nikita';
    const CURRENCY = 'INR';

    function buildWhatsAppLink(msg) {
      return `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
    }
    function buildUpiLink(amount, note) {
      const params = new URLSearchParams({
        pa: UPI_ID,
        pn: PAYEE_NAME,
        am: amount,
        tn: note,
        cu: CURRENCY
      });
      return `upi://pay?${params.toString()}`;
    }

    document.getElementById('waTop').href = buildWhatsAppLink('Hi Nikita, I want to know more about EcoTots products.');

    async function loadProducts() {
      const res = await fetch('products.json');
      const products = await res.json();
      const grid = document.getElementById('productGrid');
      products.forEach(p => {
        const col = document.createElement('div');
        col.className = 'col-12 col-sm-6 col-lg-4';
        const card = document.createElement('div');
        card.className = 'card';
        if(p.image) {
          const img = document.createElement('img');
          img.src = p.image; img.className='card-img-top';
          card.appendChild(img);
        }
        const body = document.createElement('div');
        body.className='card-body';
        body.innerHTML = `<h5>${p.name}</h5><p>${p.description}</p><p class='text-success'>₹${p.price}</p>`;
        const waBtn = document.createElement('a');
        waBtn.className='btn btn-success me-2';
        waBtn.textContent='Order via WhatsApp';
        waBtn.href=buildWhatsAppLink(`Hello Nikita, I want to order: ${p.name} for ₹${p.price}.`);
        waBtn.target='_blank';
        const upiBtn = document.createElement('a');
        upiBtn.className='btn btn-primary';
        upiBtn.textContent='Pay via UPI';
        upiBtn.href=buildUpiLink(p.price, `Payment for ${p.name}`);
        body.appendChild(waBtn);
        body.appendChild(upiBtn);
        card.appendChild(body);
        col.appendChild(card);
        grid.appendChild(col);
      });
    }
    loadProducts();
  </script>
</body>
</html>
