
<!-- Somewhere in the body -->
<div id="catalog" class="grid"></div>

<style>
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap:16px; }
  .card { background:#fff; border:1px solid #eee; border-radius:12px; overflow:hidden; box-shadow:0 2px 12px rgba(0,0,0,.05); }
  .carousel { position:relative; aspect-ratio:1/1; background:#fafafa; }
  .carousel img { width:100%; height:100%; object-fit:cover; display:block; }
  .card .body { padding:12px; }
  .price { font-weight:700; color:#27ae60; }
  .controls { display:flex; justify-content:center; gap:8px; padding:8px; }
  .controls button { border:1px solid #ddd; background:#fff; border-radius:6px; padding:4px 8px; }
</style>

<script>
async function loadProducts() {
  const res = await fetch('./data/products.json', { cache: 'no-store' });
  const products = await res.json();
  const root = document.getElementById('catalog');
  root.innerHTML = '';

  products.filter(p => p.published !== false).forEach(p => {
    const card = document.createElement('div');
    card.className = 'card';

    // Simple carousel
    let idx = 0;
    const img = document.createElement('img');
    img.src = (p.image_urls && p.image_urls[0]) || 'images/placeholder.png';

    const carousel = document.createElement('div');
    carousel.className = 'carousel';
    carousel.appendChild(img);

    const controls = document.createElement('div');
    controls.className = 'controls';
    const prev = document.createElement('button'); prev.textContent = '‹';
    const next = document.createElement('button'); next.textContent = '›';
    prev.onclick = () => { if (!p.image_urls?.length) return; idx = (idx - 1 + p.image_urls.length) % p.image_urls.length; img.src = p.image_urls[idx]; };
    next.onclick = () => { if (!p.image_urls?.length) return; idx = (idx + 1) % p.image_urls.length; img.src = p.image_urls[idx]; };
    controls.appendChild(prev); controls.appendChild(next);

    const body = document.createElement('div');
    body.className = 'body';
    body.innerHTML = `
      <div class="price">₹${p.price || '-'}</div>
      <div><strong>${p.title || ''}</strong></div>
      <div>${p.size || ''} • ${p.condition || ''}</div>
      <p style="margin:.6em 0">${p.description || ''}</p>
      <div style="display:flex; gap:8px; margin-top:8px;">
        <a class="btn" style="flex:1; text-align:center; background:#25D366; color:#fff; padding:8px; border-radius:8px; text-decoration:none;"
          :#fff; padding:8px; border-radius:8px; text-decoration:none;"
           href="upi://pay?pa=${encodeURIComponent(p.upi || '9621146688@upi')}&pn=${encodeURIComponent('Ecotots')}&am=${encodeURIComponent(p.price || '')}&cu=
