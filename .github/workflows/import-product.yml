
name: Import product from Issue

on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed]

permissions:
  contents: write
  issues: write

jobs:
  import:
    # Only run if the issue has the 'product' label
    if: contains(join(github.event.issue.labels.*.name, ','), 'product')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ensure folders
        run: |
          mkdir -p scripts data images/products
          if [ ! -f data/products.json ]; then echo "[]" > data/products.json; fi

      - name: Run importer
        run: node scripts/import-product.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Import product #${{ github.event.issue.number }}: ${{ github.event.issue.title }}"
          git push

      - name: Comment with preview
        uses: actions/github-script@v7
        with:
          script: |
            const id = context.payload.issue.number;
            const repo = `${context.repo.owner}.github.io/${context.repo.repo}`;
            const url = `https://${repo}/`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: id,
              body: `✅ Imported to catalog as **ID ${id}**.\n\nPreview: ${url}`
            });
