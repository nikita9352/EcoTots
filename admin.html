<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='utf-8' />
  <meta name='viewport' content='width=device-width, initial-scale=1' />
  <title>EcoTots — Admin (mobile)</title>
  <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css' rel='stylesheet' />
  <style> .card{box-shadow:0 4px 16px rgba(0,0,0,.06)} </style>
</head>
<body class='bg-light'>
  <div class='container py-3'>
    <h1 class='h5 mb-3'>EcoTots — Catalog Editor</h1>
    <p class='text-muted'>Use this on mobile to edit your <code>products.json</code>. Download the file and upload to your GitHub repo.</p>

    <div class='card mb-3'><div class='card-body'>
      <h2 class='h6'>Load existing products.json</h2>
      <input type='file' id='fileInput' accept='application/json' class='form-control' />
    </div></div>

    <div class='card mb-3'><div class='card-body'>
      <h2 class='h6'>Add / Edit Item</h2>
      <form id='productForm' class='row g-2'>
        <div class='col-6'><label class='form-label'>ID</label><input name='id' class='form-control' placeholder='eco201' required></div>
        <div class='col-6'><label class='form-label'>Item Name</label><input name='name' class='form-control' required></div>
        <div class='col-6'><label class='form-label'>Asking Price (₹)</label><input name='price' type='number' min='0' class='form-control' required></div>
        <div class='col-6'><label class='form-label'>Condition</label><input name='condition' class='form-control' placeholder='Brand New / Like New / Used'></div>
        <div class='col-12'><label class='form-label'>Online Link</label><input name='link' class='form-control' placeholder='https://...'></div>
        <div class='col-12'><label class='form-label'>Pickup Address</label><input name='pickup' class='form-control' placeholder='Area, City'></div>
        <div class='col-12'><label class='form-label'>Contact Number</label><input name='contact' class='form-control' placeholder='+91 9621146688'></div>

        <div class='col-12'>
          <label class='form-label'>Features (one per line)</label>
          <textarea name='features' class='form-control' rows='3' placeholder='Feature 1
Feature 2
Feature 3'></textarea>
        </div>

        <div class='col-12'>
          <label class='form-label'>Image URLs (comma-separated)</label>
          <textarea name='images' class='form-control' rows='2' placeholder='images/item1.jpg, images/item2.jpg'></textarea>
          <div class='form-text'>Tip: Upload images to your repo and paste their paths here.</div>
        </div>

        <div class='col-12'><button class='btn btn-primary' type='submit'>Add / Update Item</button></div>
      </form>
    </div></div>

    <div class='card mb-3'><div class='card-body'>
      <h2 class='h6'>Catalog</h2>
      <div class='table-responsive'>
        <table class='table table-sm align-middle'>
          <thead><tr><th>ID</th><th>Name</th><th>Price</th><th>Images</th><th>Actions</th></tr></thead>
          <tbody id='list'></tbody>
        </table>
      </div>
      <button id='downloadBtn' class='btn btn-success'>Download products.json</button>
    </div></div>
  </div>

<script>
  let items = [];

  function render(){
    const tbody = document.getElementById('list');
    tbody.innerHTML = '';
    items.forEach((p, idx) => {
      const tr = document.createElement('tr');
      const imgCount = Array.isArray(p.images) ? p.images.length : 0;
      tr.innerHTML = `<td>${p.id||''}</td><td>${p.name||''}</td><td>${p.price||''}</td><td>${imgCount}</td>`;
      const tdAct = document.createElement('td');
      const del = document.createElement('button'); del.className='btn btn-sm btn-outline-danger'; del.textContent='Delete';
      del.onclick = () => { items.splice(idx,1); render(); };
      tdAct.appendChild(del);
      tr.appendChild(tdAct);
      tbody.appendChild(tr);
    });
  }

  document.getElementById('fileInput').addEventListener('change', async (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const text = await file.text();
    try{ const j = JSON.parse(text); if(!Array.isArray(j)) throw new Error('Not array'); items = j; }catch(err){ alert('Invalid JSON'); items = []; }
    render();
  });

  document.getElementById('productForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const obj = Object.fromEntries(fd.entries());
    obj.price = Number(obj.price || 0);
    obj.features = (obj.features||'').split('
').map(s=>s.trim()).filter(Boolean);
    obj.images = (obj.images||'').split(',').map(s=>s.trim()).filter(Boolean);
    const idx = items.findIndex(x => x.id === obj.id);
    if (idx >= 0) { items[idx] = obj; } else { items.push(obj); }
    e.target.reset();
    render();
  });

  document.getElementById('downloadBtn').addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(items, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'products.json';
    a.click();
    URL.revokeObjectURL(a.href);
  });
</script>
</body>
</html>
